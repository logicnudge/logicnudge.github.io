name: Learning Hub source quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test HTML quality checks
        run: python -m unittest discover -s tests -v
      - name: Validate actual Learning Hub
        run: python scripts/site_audit.py index.html
